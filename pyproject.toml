[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parser-os-service"
version = "0.1.0"
description = "PurPulse HTTP wrapper around Parser OS (purtera-evidence-mvp) with §4.4.4 projector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # Phase 0: replace `main` with the tag from docs/decisions/0001-parser-os-pin.md
  "purtera-evidence-mvp @ git+https://github.com/Purtera-IT/parser-os.git@main",
  "azure-identity>=1.15",
  "azure-storage-blob>=12.19",
  "fastapi>=0.110",
  "psycopg[binary,pool]>=3.1",
  "pydantic>=2.5",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "mypy>=1.8",
  "numpy>=1.26",
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23",
  "scikit-learn>=1.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parser_os_service = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["^tests/"]
[[tool.mypy.overrides]]
module = ["app.*"]
ignore_errors = true
ignore_missing_imports = true
